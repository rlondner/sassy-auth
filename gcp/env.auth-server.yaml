# Non-secret env vars for the Cloud Run auth-server service.
# Mirrors the `sassy-auth-production` group + sassy-auth-server entries in render.yaml.
# Secrets (DATABASE_URL, RSA keys, BETTER_AUTH_SECRET, ...) come from Secret Manager —
# see .github/workflows/deploy-gcp.yml. Values are identical to Render so the cutover
# is a pure DNS switch.
NODE_ENV: production
LOG_LEVEL: info
DEFAULT_RATE_LIMIT: "600"
JWT_KEY_ID: sassy-auth-1
BETTER_AUTH_URL: https://auth-api.milissai.com
AUTH_SERVER_URL: https://auth-api.milissai.com
ADMIN_URL: https://auth.milissai.com
TRUSTED_ORIGINS: https://auth.milissai.com
COOKIE_DOMAIN: .milissai.com
EMAIL_FROM: no-reply@milissai.com
# Migrations run as a separate pipeline step, not on every instance start.
SKIP_MIGRATIONS: "1"
VIBECAST_APP_URL: https://app.getvibecast.com
VIBECAST_LOGIN_REDIRECT_URI: https://app.getvibecast.com/api/auth/callback
VIBECAST_LOGOUT_REDIRECT_URI: https://app.getvibecast.com/api/auth/signout
VIBECAST_ACTIVATION_WEBHOOK_URL: https://api.getvibecast.com/webhooks/sassy-auth/activation
VIBECAST_ACTIVATION_EMAIL_FROM_NAME: Raphael from VibeCast
VIBECAST_ACTIVATION_EMAIL_FROM_ADDRESS: rl@getvibecast.com
VIBECAST_ACTIVATION_EMAIL_SUBJECT: "Please verify your {{appName}} email address"
VIBECAST_ACTIVATION_EMAIL_MESSAGE: "We're so glad to have you join the growing ranks of VibeCasters! Click on the button (or the link) below to activate your VibeCast account:"
