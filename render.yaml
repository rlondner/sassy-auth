# SassyAuth — Render Blueprint (production account)
#
# Deploys two web services against an external Neon Postgres database.
# See DEPLOYMENT.md for DNS, secrets, first-time seed, and app registration.
#
# Apply: Render Dashboard → New → Blueprint → connect this repo.
# Custom domains and secret values are prompted on first sync (sync: false).
#
# Staging lives in a separate Render account — see render.staging.yaml and
# DEPLOYMENT.md's "Staging environment" section. It is not part of this file.

envVarGroups:
  - name: sassy-auth-production
    envVars:
      # ── Neon Postgres (https://neon.tech) ───────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ── JWT signing (generate once — see DEPLOYMENT.md) ─────────────────
      - key: RSA_PRIVATE_KEY
        sync: false
      - key: RSA_PUBLIC_KEY
        sync: false
      - key: JWT_KEY_ID
        value: sassy-auth-1

      # ── BetterAuth session secret (32+ random chars, stable across deploys)
      - key: BETTER_AUTH_SECRET
        sync: false

      # ── Rate limiting (common/config/rate-limit-config.ts) ──────────────
      # `default` bucket covers the general API surface, including Render's
      # own healthCheckPath polling (auth-server's own discovery endpoint,
      # plus every /login health-check hit on sassy-auth-admin, which
      # server-renders and calls GET /api/social-providers on every request
      # regardless of real traffic — see bug found 2026-09-17). Raised from
      # the 120/60s code default after that combined health-check volume
      # sporadically tripped it.
      - key: DEFAULT_RATE_LIMIT
        value: "600"

      # ── Public URLs (must match custom domains + TLS) ───────────────────
      - key: BETTER_AUTH_URL
        value: https://auth-api.milissai.com
      - key: AUTH_SERVER_URL
        value: https://auth-api.milissai.com
      - key: ADMIN_URL
        value: https://auth.milissai.com

      # BetterAuth CSRF + Nest CORS. Include every browser origin that talks
      # to the auth-server (admin console).
      - key: TRUSTED_ORIGINS
        value: https://auth.milissai.com

      # ── Production defaults ─────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: EMAIL_FROM
        value: no-reply@milissai.com

services:
  # ── Auth server (NestJS + BetterAuth) ───────────────────────────────────
  - type: web
    name: sassy-auth-server
    runtime: node
    plan: starter
    region: ohio
    branch: master
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@9.0.0 --activate &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @sassy-auth/db --filter @sassy-auth/types build &&
      pnpm --filter @sassy-auth/auth-server build
    # NODE_ENV=development on the install step only: the production NODE_ENV value from
    # sassy-auth-production (below) is present during the build too, and pnpm skips
    # devDependencies — including @nestjs/cli, needed for `nest build` — whenever it sees
    # NODE_ENV=production. The override doesn't affect the actual running process; that
    # gets its NODE_ENV from the service env vars, not this build-time shell prefix.
    #
    # Requires a paid instance type (Starter or above). On Free, move this
    # command to the end of buildCommand — see DEPLOYMENT.md.
    preDeployCommand: cd packages/db && npx prisma migrate deploy
    startCommand: cd apps/auth-server && node dist/main.js
    healthCheckPath: /.well-known/oauth-authorization-server
    domains:
      - auth-api.milissai.com
    envVars:
      - fromGroup: sassy-auth-production
      - key: NODE_VERSION
        value: "24"
      # Required in production — seed refuses the dev default otherwise.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # VibeCast app provisioning (vibecast-migration.ts) is a second Render Job run by
      # the deploy workflow after every db:seed. The script only reads these the first
      # time it creates the vibecast SaApp/redirect URIs — once created, those values are
      # owned by the SaApp record instead (editable via the admin console), and these vars
      # are ignored on every later run. See the comment atop vibecast-migration.ts.
      - key: VIBECAST_APP_URL
        value: https://app.getvibecast.com
      - key: VIBECAST_LOGIN_REDIRECT_URI
        value: https://app.getvibecast.com/api/auth/callback
      - key: VIBECAST_LOGOUT_REDIRECT_URI
        value: https://app.getvibecast.com/api/auth/signout
      # Outbound mail — set RESEND_API_KEY (recommended) or SMTP vars.
      - key: RESEND_API_KEY
        sync: false
      # Optional social providers — see docs/social-auth-setup.md
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false

  # ── Admin console (Next.js) ───────────────────────────────────────────────
  - type: web
    name: sassy-auth-admin
    runtime: node
    plan: starter
    region: ohio
    branch: master
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@9.0.0 --activate &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @sassy-auth/admin build
    # See the matching comment on sassy-auth-server's buildCommand — same NODE_ENV/pnpm
    # devDependencies gotcha, needed here for `next build`'s devDependencies (typescript).
    startCommand: cd apps/admin && npx next start -p $PORT
    healthCheckPath: /login
    domains:
      - auth.milissai.com
    envVars:
      - fromGroup: sassy-auth-production
      - key: NODE_VERSION
        value: "24"
      # Browser-facing auth-server URL for social sign-in redirects on /login.
      - key: PUBLIC_AUTH_SERVER_URL
        value: https://auth-api.milissai.com
