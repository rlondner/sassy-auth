name: Deploy to Render (staging)

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-render-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    # See the matching comment in deploy-render.yml — same timeout budget.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run deploy automation
        working-directory: packages/deploy-render
        run: pnpm run deploy
        env:
          DEPLOY_TARGET: staging
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Human-provisioned secrets, stored in the "staging" GitHub Environment (secrets
          # are scoped per-Environment). GH_SECRETS_PAT, NEON_API_KEY, and NEON_ORG_ID are
          # the same values as production's, duplicated here. RENDER_API_KEY is NOT the
          # same as production's — staging deploys into its own, separate Render account,
          # so this must be an API key generated from that account. See DEPLOYMENT.md's
          # "Staging environment" section.
          DEPLOY_GITHUB_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # Required only when NEON_API_KEY is a Neon organization API key.
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          # CLI-managed secrets: independent from production's — generated/rotated by the
          # deploy-render CLI itself and written back to GitHub via DEPLOY_GITHUB_TOKEN above.
          RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
          RSA_PUBLIC_KEY: ${{ secrets.RSA_PUBLIC_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
