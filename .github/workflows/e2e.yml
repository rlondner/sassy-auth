name: e2e

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-e2e:
    runs-on: ubuntu-latest
    # The suite runs ~170 tests serially (workers: 1 in CI) plus install,
    # build, migrate and seed. 20 min was too tight and truncated runs; 35
    # gives headroom without masking a genuine hang.
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sassy
          POSTGRES_PASSWORD: sassy
          POSTGRES_DB: sassy_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sassy -d sassy_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # All values below are non-sensitive test-only — the Postgres DB is
      # ephemeral and torn down after every run.
      CI_TESTS: 'true'
      DATABASE_URL: postgresql://sassy:sassy@localhost:5432/sassy_e2e
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: test-secret-at-least-32-chars-long!!
      AUTH_SERVER_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sassy-auth/db exec prisma generate --schema=schema.prisma

      - name: Apply migrations
        run: pnpm --filter @sassy-auth/db exec prisma migrate deploy --schema=schema.prisma

      # The auth-server and admin apps import the workspace libraries via
      # their built output (`main: ./dist/index.js`). Compile them so the
      # dev servers started by Playwright can resolve `@sassy-auth/db` and
      # `@sassy-auth/types` at runtime.
      - name: Build shared packages
        run: pnpm --filter @sassy-auth/db --filter @sassy-auth/types build

      # bug-0092: auth-server compilation was previously excluded from CI
      # because of TS2742 on BetterAuth's inferred type and a shape
      # mismatch on the OpenAPI merger. Both are fixed on master
      # (`declaration: false` in tsconfig + a documented cast at the
      # OpenAPI merge call site), so we can require the build again as
      # a gate against regressions.
      - name: Build auth-server (typecheck gate)
        run: pnpm --filter @sassy-auth/auth-server build

      - name: Generate RSA keypair for auth-server
        run: |
          mkdir -p ./keys
          openssl genpkey -algorithm RSA -out ./keys/private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -in ./keys/private.pem -pubout -out ./keys/public.pem
          echo "RSA_PRIVATE_KEY=$(base64 -w0 ./keys/private.pem)" >> $GITHUB_ENV
          echo "RSA_PUBLIC_KEY=$(base64 -w0 ./keys/public.pem)" >> $GITHUB_ENV

      - name: Seed platform data
        # SEED_DEMO_MULTITENANT provisions the app01 Acme/Globex tenants and
        # their admins (e.g. acme-admin@app01.io) that
        # multitenant-tenant-admin.spec.ts signs in as.
        env:
          SEED_DEMO_MULTITENANT: '1'
        run: pnpm --filter @sassy-auth/auth-server seed

      - name: Set up Python for FastAPI RS
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FastAPI RS dependencies
        working-directory: apps/resource-server-fastapi
        run: |
          pip install fastapi "uvicorn[standard]" httpx "pyjwt[crypto]" pydantic-settings jinja2

      - name: Seed RS app and write publicId
        env:
          RS_APP_URL: 'http://localhost:8010'
          SEED_DEMO: '1'
          APP_NAME: resourceserver01
          OUT_FILE: /tmp/sassy-e2e-rs-client-id.txt
        run: |
          pnpm --filter @sassy-auth/auth-server seed
          pnpm --filter @sassy-auth/db exec node scripts/print-app-public-id.cjs

      - name: Install Playwright browsers
        run: pnpm --filter @sassy-auth/admin-e2e exec playwright install --with-deps chromium

      - name: Run e2e
        id: run-e2e
        env:
          RS_BASE_URL: 'http://localhost:8010'
        run: |
          test -s /tmp/sassy-e2e-rs-client-id.txt || { echo "ERROR: /tmp/sassy-e2e-rs-client-id.txt is missing or empty"; exit 1; }
          RS_CLIENT_ID=$(cat /tmp/sassy-e2e-rs-client-id.txt)
          export RS_CLIENT_ID
          pnpm --filter @sassy-auth/admin-e2e test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin-e2e/playwright-report/
          retention-days: 3

      - name: Upload test results (traces, videos, attachments)
        if: ${{ failure() && steps.run-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/admin-e2e/test-results/
          retention-days: 3
