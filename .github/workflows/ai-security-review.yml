name: AI Semantic Security Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, master]

# 1. HARDENING: Restrict permissions globally.
# Actions default to broad access. This limits the token to read-only code access
# and write access only for PR comments.
permissions:
  contents: read
  pull-requests: write
  issues: none
  actions: none

jobs:
  claude-security-review:
    name: Claude Code Analysis
    runs-on: ubuntu-latest

    # 2. HARDENING: Prevent infinite loops or stalled agents draining runner minutes
    timeout-minutes: 15

    # 3. HARDENING: Do not run on PRs from forks to prevent prompt injection
    # from unverified external contributors accessing your API keys.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch depth 2 is optimal for PR diffs without downloading entire histories
          fetch-depth: 2

      # 4. HARDENING: Explicitly delete sensitive file types before the AI agent
      # can even read the directory tree, acting as a failsafe against misconfiguration.
      - name: Pre-scan Context Sanitization
        # bug-0266 (continued): `*.env` only matches a file literally named
        # ".env" or ending in ".env" with nothing after — it never matched
        # this repo's actual secret-bearing files: `.env.local`,
        # `.env.example` (template, low-risk, but still not what was
        # intended to survive), or any other `.env.*`. Also added the
        # Apple `.p8` private key format this repo actually uses
        # (APPLE_PRIVATE_KEY in .env.example) alongside the RSA key pattern.
        run: |
          find . -name ".env*" -type f -delete
          find . -name "*.pem" -type f -delete
          find . -name "*.p8" -type f -delete
          find . -name "*_rsa" -type f -delete

      - name: Run Claude Security Review
        # bug-0266: anthropics/claude-code-security-review has no tags or
        # releases at all (`gh api repos/anthropics/claude-code-security-review/tags`
        # is empty) — `@v1` can never resolve and every run fails immediately
        # at "Unable to resolve action ... unable to find version `v1`",
        # before the review itself is ever attempted. Pin to a specific
        # commit SHA on main rather than `@main` itself: this action reads
        # ANTHROPIC_API_KEY and has PR write access, so floating on a mutable
        # branch is a supply-chain risk this workflow's own hardening
        # comments elsewhere are trying to avoid. Bump deliberately.
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        # bug-0266 (continued): every key in this `with:` block was also
        # wrong — checked against the action's actual action.yml
        # (`gh api repos/anthropics/claude-code-security-review/contents/action.yml`).
        # `github_token` isn't a real input at all (the action reads
        # `${{ github.token }}` internally for PR comments — nothing to
        # pass here); `anthropic_api_key`/`model`/`exclude_paths` are the
        # right idea with the wrong spelling (`claude-api-key`/
        # `claude-model`/`exclude-directories`); `severity_threshold` and
        # inline `system_prompt` text have no equivalent input at all —
        # GitHub Actions silently drops unrecognised `with:` keys rather
        # than erroring, so none of these six settings the workflow's own
        # comments claim to configure were ever actually applied, even once
        # the version pin below resolves.
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: "claude-sonnet-5"

          # 5. HARDENING: Instruct the model to strictly output findings and
          # ignore any embedded commands in the code (Prompt Injection defense).
          # `custom-security-scan-instructions` takes a FILE PATH, not
          # inline text (per action.yml) — moved to
          # .github/claude-security-scan-instructions.md.
          custom-security-scan-instructions: .github/claude-security-scan-instructions.md

          # 6. HARDENING: Restrict the agent's context window to source code
          # only. `exclude-directories` matches by directory-path substring
          # (see claudecode/github_action_audit.py's `_is_excluded`), NOT
          # glob patterns — `tests/**`, `**/*.lock`, `**/*.md`, and
          # `package-lock.json` never matched anything under this mechanism.
          # This repo's tests mostly live in `__tests__/` directories;
          # colocated `*.spec.ts` files sitting next to their source (e.g.
          # apps/auth-server/src/social/*.spec.ts) can't be excluded this
          # way — there is no file-extension exclusion input on this action.
          exclude-directories: "__tests__,node_modules,dist,.next,.turbo"

          # Note: there is no severity-threshold input on this action — the
          # original `severity_threshold: "high"` had nothing to attach to
          # and is dropped rather than kept as dead configuration.
