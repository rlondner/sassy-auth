name: typecheck

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # bug-0280: prisma.config.ts (packages/db) now fails fast if
      # DATABASE_URL is unset, same as packages/db/index.ts already did.
      # `pnpm install`'s postinstall (`prisma generate`) and the explicit
      # "Generate Prisma client" step below both load that config, and
      # nothing in this job connects to a database — an
      # unreachable-but-valid connection string is sufficient (same value
      # unit-tests.yml already uses for the same reason).
      DATABASE_URL: postgresql://test:test@localhost:5432/test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # admin and ui import @sassy-auth/db and @sassy-auth/types through their
      # built output, so the workspace libraries must exist before tsc can
      # resolve them. `prisma generate` is what produces the db package's types.
      - name: Generate Prisma client
        run: pnpm --filter @sassy-auth/db exec prisma generate

      - name: Build shared packages
        run: pnpm --filter @sassy-auth/db --filter @sassy-auth/types build

      # The e2e workflow already gates auth-server (and, transitively, db and
      # types) via `nest build`. admin and ui had no type coverage in CI at all
      # until this job.
      #
      # Both use tsconfig.ci.json, which excludes __tests__. The test files
      # currently fail to typecheck for a reason unrelated to the code under
      # test: packages/ui is missing @types/jest, apps/admin is missing
      # @jest/globals, and two admin fixtures predate `createdAt`/`lastLoginAt`
      # being added to the User type. Production source is clean and gated here;
      # drop the ci configs and switch to `typecheck` once the test-side type
      # wiring is fixed.
      - name: Typecheck admin console (production source)
        run: pnpm --filter @sassy-auth/admin typecheck:ci

      - name: Typecheck ui package (production source)
        run: pnpm --filter @sassy-auth/ui typecheck:ci
