name: Dependency & CVE Scan (Trivy)

on:
  pull_request:
    branches: [ main, master ]
  schedule:
    # Daily at midnight UTC. CVE databases update constantly;
    # this catches new vulnerabilities even if no code changes occur.
    - cron: '0 0 * * *'

permissions:
  contents: read
  # Required to upload SARIF results to the GitHub Security tab
  security-events: write
  actions: read

jobs:
  trivy-scan:
    name: Trivy SCA & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Prevent execution on unverified external forks
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'schedule'

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Generate SARIF Report
        # bug-0265 (continued): pin to a released version + commit SHA
        # rather than the mutable @master branch. This step runs with
        # security-events: write, and the "Enforce PR Block on Critical
        # CVEs" step below gates every PR merge — floating on @master
        # means an upstream compromise or an unreviewed breaking change
        # takes effect the next time this workflow runs, with no diff to
        # review. v0.36.0 was the latest tag at the time of this fix.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          # Filter for actionable, fixable vulnerabilities
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        # bug-0265: this repo is private without GitHub Advanced Security, so
        # code scanning is not enabled and this upload always fails with
        # "Code scanning is not enabled for this repository". Without
        # continue-on-error, that failure stops the job here — the next step
        # (the actual CRITICAL-CVE build gate) never runs, silently
        # defeating the one thing this workflow exists to enforce. Re-enable
        # the SARIF upload for real once code scanning is available.
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Enforce PR Block on Critical CVEs
        if: github.event_name == 'pull_request'
        # bug-0265 (continued): same version+SHA pin as above, same reason —
        # this is the step that actually gates PR merges on CRITICAL CVEs.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true
          # Only hard-fail the build on CRITICAL severities
          severity: 'CRITICAL'
          format: 'table'
          # Exit code 1 forces the action to fail, blocking the PR
          exit-code: '1'
