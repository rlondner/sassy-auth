## Flox Environment Manifest -----------------------------------------
##
##   _Everything_ you need to know about the _manifest_ is here:
##
##   https://flox.dev/docs/reference/command-reference/manifest.toml/
##
## -------------------------------------------------------------------
# Flox manifest version managed by Flox CLI
schema-version = "1.13.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
nodejs.pkg-path = "nodejs_26"
nodejs.version = "26.3.0"
pnpm.pkg-path = "pnpm"
postgresql.pkg-path = "postgresql"
python.pkg-path = "python311"
uv.pkg-path = "uv"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
PGHOST = "localhost"
PGPORT = "5433"
PGUSER = "postgres"
PGDATABASE = "sassyauth"
BETTER_AUTH_URL = "http://localhost:3000"
ADMIN_URL = "http://localhost:3001"
AUTH_SERVER_URL = "http://localhost:3000"
TRUSTED_ORIGINS = "http://localhost:3001"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = """
  export PGDATA="$HOME/.local/share/sassy-auth/postgres/data"
  export DATABASE_URL="postgresql://$PGUSER@$PGHOST:$PGPORT/$PGDATABASE"

  pnpm install

  # Generate .env.local with secrets pre-filled on first activation
  if [ ! -f .env.local ]; then
    node -e '
      const c = require("crypto");
      const fs = require("fs");
      const { privateKey, publicKey } = c.generateKeyPairSync("rsa", { modulusLength: 2048 });
      fs.writeFileSync("/tmp/_sassy_priv.b64", Buffer.from(privateKey.export({ type: "pkcs8", format: "pem" })).toString("base64"));
      fs.writeFileSync("/tmp/_sassy_pub.b64", Buffer.from(publicKey.export({ type: "spki", format: "pem" })).toString("base64"));
    '
    RSA_PRIVATE_KEY=$(cat /tmp/_sassy_priv.b64)
    RSA_PUBLIC_KEY=$(cat /tmp/_sassy_pub.b64)
    rm -f /tmp/_sassy_priv.b64 /tmp/_sassy_pub.b64
    BETTER_AUTH_SECRET=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")

    cat > .env.local << ENVEOF
# Auto-generated by Flox on first activation — edit as needed

# Database (managed by Flox postgres service)
DATABASE_URL="$DATABASE_URL"

# RSA RS256 key pair (auto-generated)
RSA_PRIVATE_KEY="$RSA_PRIVATE_KEY"
RSA_PUBLIC_KEY="$RSA_PUBLIC_KEY"
JWT_KEY_ID="sassy-auth-1"

# BetterAuth
BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET"
BETTER_AUTH_URL="$BETTER_AUTH_URL"

# Admin console
ADMIN_URL="$ADMIN_URL"
AUTH_SERVER_URL="$AUTH_SERVER_URL"
TRUSTED_ORIGINS="$TRUSTED_ORIGINS"

# Social providers — fill in if needed
GOOGLE_CLIENT_ID=""
GOOGLE_CLIENT_SECRET=""
MICROSOFT_CLIENT_ID=""
MICROSOFT_CLIENT_SECRET=""
APPLE_CLIENT_ID=""
APPLE_CLIENT_SECRET=""
GITHUB_CLIENT_ID=""
GITHUB_CLIENT_SECRET=""

# Observability — leave blank to disable in dev
SENTRY_DSN=""
NEXT_PUBLIC_SENTRY_DSN=""
SENTRY_AUTH_TOKEN=""
SENTRY_ORG=""
SENTRY_PROJECT=""
SENTRY_ENVIRONMENT=""
LOG_LEVEL=""

# Other
SQIDS_ALPHABET=""
NEXT_PUBLIC_ADMIN_CONTACT_EMAIL=""
LOGIN_NEXT_ALLOWED_ORIGINS=""
SEED_DEMO=""
ENVEOF
    echo "✓ Generated .env.local"
  fi

  # Initialize Postgres, run migrations and seed on first activation
  if [ ! -d "$PGDATA" ]; then
    initdb --username="$PGUSER" --auth=trust
    pg_ctl start -D "$PGDATA" -o "-p $PGPORT -k /tmp" -w -l "$PGDATA/postgres.log"
    createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$PGDATABASE"
    pnpm --filter @sassy-auth/db db:generate
    pnpm --filter @sassy-auth/db db:migrate:deploy
    pnpm --filter @sassy-auth/db db:seed
    pg_ctl stop -D "$PGDATA" -m fast -w
  fi
"""


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
